# Netlify build config for the Trooth React app.
[build]
  command = "npm run build"
  publish = "dist"

# Legacy person URLs: speaker ids moved to registry ids (speakers-v1.json v1.2.0, 2026-10-15).
# Keep old /person links working. Must stay above the SPA fallback.
[[redirects]]
  from = "/person/brad-crawford"
  to = "/person/cbs-brad-crawford"
  status = 301

[[redirects]]
  from = "/person/brandon-marcello"
  to = "/person/cbs-brandon-marcello"
  status = 301

